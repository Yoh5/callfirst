# The hosted demo on Render. Every secret is generated by Render; nothing to
# paste. OPENAI_API_KEY is optional: without it, delivery messages are read by
# rules instead of a model.
services:
  - type: web
    name: callfirst
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python scripts/setup_sandbox.py
    startCommand: python scripts/hosted.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: CALLFIRST_KEY
        generateValue: true
      - key: RING_WEBHOOK_KEY
        generateValue: true
      - key: CALLFIRST_ADMIN_TOKEN
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
