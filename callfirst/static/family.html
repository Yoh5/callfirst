<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Call First — family</title>
<link rel="icon" href="/static/favicon.svg">
<link rel="preload" href="/static/fonts/atkinson-hyperlegible-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/common.js" defer></script>
<script src="/static/family.js" defer></script>
</head>
<body>
<nav><a class="brand" href="/"><img src="/static/logo-mark.svg" alt=""> Call First</a> <span class="who" id="who"></span></nav>
<main>
  <div id="status" class="status off" aria-live="polite"><h1>Loading…</h1></div>
  <section class="card todo" id="todo" hidden></section>
  <h2>Alerts</h2>
  <div id="alerts"></div>
  <h2>You</h2>
  <section class="card">
    <p class="small" id="you"></p>
    <div class="row"><button class="danger" id="stop">Stop receiving alerts</button></div>
  </section>
</main>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
